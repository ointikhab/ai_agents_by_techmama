propose:
  description: >
    You are proposing the motion: {motion}.
    Come up with a clear argument in favour of the motion.
    Be very convincing.
  expected_output: >
    Your clear argument in the favour of the motion, in concise manner.
  agent: debater
  output_file: output/propose.md

oppose:
  description: >
    You are in opposition of the motion: {motion}.
    Come up with a clear argument against the motion.
    Be very convincing.
  expected_output: >
    Your clear argument against the motion, in concise manner.
  agent: debater
  output_file: output/oppose.md

decide:
  description: >
    Review the arguments presented by debaters and decide which side is more convincing.
  expected_output: >
    You decide which side is more convincing and why.
  output_file: output/decision.md
  agent: judge
